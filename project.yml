name: MyMouseBattery
options:
  bundleIdPrefix: com.jmaudisio
  deploymentTarget:
    macOS: "12.0"
  xcodeVersion: "15.0"
  developmentLanguage: es
  knownRegions:
    - es
    - en

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "12.0"

targets:
  MyMouseBattery:
    type: application
    platform: macOS
    sources:
      - MyMouseBattery
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jmaudisio.InputBattery
        INFOPLIST_FILE: MyMouseBattery/Info.plist
        CODE_SIGN_IDENTITY: "Apple Distribution"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: MyMouseBattery/InputBattery.entitlements
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: MyMouseBattery/Info.plist
      properties:
        CFBundleName: InputBattery
        CFBundleDisplayName: Input Battery
        CFBundleIdentifier: com.jmaudisio.InputBattery
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        CFBundlePackageType: APPL
        CFBundleExecutable: MyMouseBattery
        LSMinimumSystemVersion: "12.0"
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "Copyright \u00a9 2026 JM Audisio. All rights reserved."
